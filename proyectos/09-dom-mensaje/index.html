<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un mensaje para ti</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Un mensaje para enviar</h1>
        <input class="input" type="text" value="" placeholder="Escribe tu mensaje ...">
        <div class="btn">Enviar</div>
        <p class="error">Por favor ingresa un mensaje!</p>
        <h3>El ultimo mensaje fue ...</h3>
        <p class="mensaje">No se ha escrito ningun mensaje</p>
    </div>
    <script src="script.js"></script>
</body>

</html>
